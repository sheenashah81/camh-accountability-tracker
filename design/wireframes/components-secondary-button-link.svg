<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"><rect width="760" height="420" fill="#FFFFFF"/>
<text x="40" y="44" font-family="Noto Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A1A" text-anchor="start" >Secondary button</text>
<text x="40" y="68" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#595959" text-anchor="start" >White fill, 2 px primary border, primary text. Matches the Clear all filters button in the build.</text>
<text x="40" y="108" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#595959" text-anchor="start" >Default</text>
<text x="235" y="108" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#595959" text-anchor="start" >Hover</text>
<text x="430" y="108" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#595959" text-anchor="start" >Focus</text>
<text x="625" y="108" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#595959" text-anchor="start" >Disabled</text>
<g id="Secondary button / Default">
<rect x="40" y="120" width="170" height="44" rx="4" fill="#FFFFFF" stroke="#0B6E99" stroke-width="2"/>
<text x="125.0" y="148" font-family="Noto Sans, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B6E99" text-anchor="middle" >Clear filters</text>
</g>
<g id="Secondary button / Hover">
<rect x="235" y="120" width="170" height="44" rx="4" fill="#E8F6FC" stroke="#0B6E99" stroke-width="2"/>
<text x="320.0" y="148" font-family="Noto Sans, Arial, sans-serif" font-size="16" font-weight="600" fill="#00577D" text-anchor="middle" >Clear filters</text>
</g>
<g id="Secondary button / Focus">
<rect x="425" y="115" width="180" height="54" rx="8" fill="none" stroke="#1A1A1A" stroke-width="3"/>
<rect x="430" y="120" width="170" height="44" rx="4" fill="#FFFFFF" stroke="#0B6E99" stroke-width="2"/>
<text x="515.0" y="148" font-family="Noto Sans, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B6E99" text-anchor="middle" >Clear filters</text>
</g>
<g id="Secondary button / Disabled">
<rect x="625" y="120" width="95" height="44" rx="4" fill="#F2F4F7" stroke="#D0D5DD" stroke-width="2"/>
<text x="672.5" y="148" font-family="Noto Sans, Arial, sans-serif" font-size="16" font-weight="600" fill="#595959" text-anchor="middle" >Clear</text>
</g>
<text x="40" y="196" font-family="Noto Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#595959" text-anchor="start" >Disabled is a design proposal; the build does not yet use a disabled secondary button.</text>
<text x="40" y="250" font-family="Noto Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A1A" text-anchor="start" >Link</text>
<text x="40" y="274" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#595959" text-anchor="start" >Primary colour, always underlined (the build keeps the underline so links never rely on colour alone).</text>
<text x="40" y="314" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#595959" text-anchor="start" >Default</text>
<text x="235" y="314" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#595959" text-anchor="start" >Hover</text>
<text x="430" y="314" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#595959" text-anchor="start" >Focus</text>
<g id="Link / Default">
<text x="40" y="350" font-family="Noto Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#0B6E99" text-anchor="start" >Source and licence</text>
<line x1="40" y1="353" x2="182" y2="353" stroke="#0B6E99" stroke-width="1.5"/></g>
<g id="Link / Hover">
<text x="235" y="350" font-family="Noto Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#00577D" text-anchor="start" >Source and licence</text>
<line x1="235" y1="353" x2="377" y2="353" stroke="#00577D" stroke-width="1.5"/></g>
<g id="Link / Focus">
<rect x="425" y="328" width="152.20000000000002" height="32" rx="4" fill="none" stroke="#1A1A1A" stroke-width="3"/>
<text x="430" y="350" font-family="Noto Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#0B6E99" text-anchor="start" >Source and licence</text>
<line x1="430" y1="353" x2="572" y2="353" stroke="#0B6E99" stroke-width="1.5"/></g>
<text x="40" y="396" font-family="Noto Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#595959" text-anchor="start" >Focus ring: 3 px solid #1A1A1A outside the element. Hover darkens to primary-dark #00577D.</text>
</svg>