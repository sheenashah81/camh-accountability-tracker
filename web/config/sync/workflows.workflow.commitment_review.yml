id: commitment_review
label: 'Commitment review'
type: content_moderation
type_settings:
  states:
    draft:
      label: Draft
      weight: 0
      published: false
      default_revision: false
    in_review:
      label: 'In review'
      weight: 2
      published: false
      default_revision: false
    published:
      label: Published
      weight: 1
      published: true
      default_revision: true
    rejected:
      label: Rejected
      weight: 3
      published: false
      default_revision: false
  transitions:
    approve_and_publish:
      label: 'Approve and publish'
      from:
        - in_review
      to: published
      weight: 3
    back_to_draft:
      label: 'Return to draft'
