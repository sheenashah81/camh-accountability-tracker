        - rejected
      to: draft
      weight: 4
    create_new_draft:
      label: 'Create New Draft'
      from:
        - draft
        - published
      to: draft
      weight: 0
    reject:
      label: 'Reject with comment'
      from:
        - in_review
      to: rejected
      weight: 2
    submit_for_review:
      label: 'Submit for review'
      from:
        - draft
      to: in_review
      weight: 1
